<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Módulo 1 · Avícola La Lojana</title>
<style>
:root{--bg:#f3efe8;--card:#fff;--ink:#25302a;--g:#0f4a30;--g2:#2e6b4a;--o:#e8630a;--lo:#fdeedd;--lg:#dceadd;--lr:#f7ddd9;--r:#c0392b;--b:#e7f0fb;--line:#d9d0c4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0b2f1f;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--b:#1d3047;--line:#3b4a41}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0b2f1f;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--b:#1d3047;--line:#3b4a41}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:17px/1.45 "Trebuchet MS","Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--card);border-bottom:3px solid var(--o);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header img{width:34px}.brand{font-weight:700;color:var(--g2);line-height:1.1}.brand small{display:block;font-weight:400;color:var(--ink);opacity:.8}
.who{margin-left:auto;font-size:14px;text-align:right}.pg{flex:1 1 150px;min-width:140px;font-size:13px}.pg i{display:block;height:7px;border-radius:4px;background:var(--line);margin-top:3px}.pg i b{display:block;height:100%;border-radius:4px;background:var(--g2);width:0}
.wrap{display:grid;grid-template-columns:240px 1fr;gap:14px;max-width:1000px;margin:0 auto;padding:14px}
aside{background:var(--card);border-radius:14px;padding:10px;align-self:start}aside button.j{display:flex;gap:8px;width:100%;font:inherit;font-size:15px;text-align:left;color:inherit;background:none;border:0;border-radius:10px;padding:8px;min-height:40px;align-items:center}
aside button.j.on{background:var(--g);color:#fff}aside button.j:disabled{opacity:.5}.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--lg);color:var(--g);display:grid;place-items:center;font-size:13px;font-weight:700}.on .n{background:#fff}
.time{margin-top:10px;background:var(--lg);border-radius:12px;padding:10px;font-size:14px}.time b{display:block;font-size:20px;color:var(--g2)}
#tg{display:none;font:inherit;font-weight:700;background:var(--card);color:var(--g2);border:2px solid var(--g2);border-radius:20px;padding:8px 14px;margin:10px 14px 0;min-height:44px}
.hero{background:linear-gradient(120deg,var(--g),var(--g2));color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}.hero small{opacity:.85}.hero h1{margin:2px 0 6px;font-size:26px;line-height:1.15}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.tabs div{background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;font-size:13.5px;font-weight:700;opacity:.6}.tabs .on{opacity:1;background:var(--g);color:#fff}.tabs .ok{opacity:1;color:var(--g2)}
.pnl{background:var(--card);border-radius:16px;padding:16px}h2{margin:0 0 8px;font-size:21px;color:var(--g2)}
.say{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}.say img{width:54px;flex:none}.bub{background:var(--lo);border-radius:14px;padding:11px 13px;flex:1}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bx{border-radius:12px;padding:12px;margin:8px 0}.bx.b{background:var(--b)}.bx.o{background:var(--lo)}.bx h3{margin:0 0 4px;font-size:16px}.bx ul{margin:0;padding-left:20px}
details{border:2px solid var(--g2);border-radius:12px;padding:10px 12px;margin:10px 0}summary{font-weight:700;color:var(--g2);min-height:32px}
.pick{border-color:var(--o)!important;background:var(--lo)!important}.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:48px}.ok2{background:var(--lg)!important;border-color:var(--g2)!important}.bad{background:var(--lr)!important;border-color:var(--r)!important}
.why{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:15.5px;background:var(--lg)}.why.bad{background:var(--lr)}
.row{border:2px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.row p{margin:0 0 6px}.tg{display:flex;gap:8px}.tg button{flex:1;font:inherit;font-weight:700;border:2px solid;border-radius:22px;padding:9px;min-height:44px;background:var(--card);color:inherit}.tg .y{border-color:var(--g2)}.tg .n{border-color:var(--r)}.tg .s.y{background:var(--g2);color:#fff}.tg .s.n{background:var(--r);color:#fff}
.chip{display:inline-block;font:inherit;font-size:15px;background:var(--lo);border:2px solid var(--o);color:inherit;border-radius:20px;padding:7px 12px;margin:3px 5px 3px 0;min-height:42px}.chip.on{background:var(--o);color:#fff}
input[type=text]{width:100%;font:inherit;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.go{display:block;margin:14px auto 0;font:inherit;font-weight:700;color:#fff;background:var(--g);border:0;border-radius:26px;padding:14px 28px;min-height:52px}.go:disabled{opacity:.4}.back{font:inherit;color:var(--g2);background:none;border:0;padding:10px;min-height:44px}
.sum{background:var(--lg);border-radius:14px;padding:14px;margin:10px 0}.big{font-size:34px;font-weight:700;color:var(--o);line-height:1}.small{font-size:14px;opacity:.85}
.share{display:block;text-align:center;text-decoration:none;font:inherit;font-weight:700;border-radius:26px;padding:13px;margin:8px 0;background:#1f9d55;color:#fff;border:0;width:100%}.share.alt{background:var(--card);color:var(--o);border:2px solid var(--o)}
textarea{width:100%;height:120px;font:14px monospace;border-radius:10px;padding:8px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--o);outline-offset:2px}
@media(max-width:760px){.wrap{grid-template-columns:1fr;padding:10px}aside{display:none}aside.show{display:block}#tg{display:inline-block}.cols{grid-template-columns:1fr}.hero h1{font-size:23px}.tabs div{font-size:12px}}
</style></head><body>

const J1={sub:"Una empresa con respeto y oportunidades para todos fortalece el trabajo en equipo.",
ess:"Todas las personas tenemos derecho a trabajar en condiciones de <b>igualdad</b>, con una remuneración justa, las <b>mismas oportunidades</b> y <b>respeto</b>.",

ideas:["<b>Respeto:</b> tratamos a todos con dignidad.","<b>Igualdad:</b> todos tenemos las mismas oportunidades.","<b>Inclusión:</b> valoramos las diferencias.","<b>Entorno seguro:</b> sin acoso ni violencia."],
deep:"<p><b>Constitución, Art. 11:</b> todas las personas son iguales y gozan de los mismos derechos, sin discriminación por sexo, edad, etnia, discapacidad ni ninguna otra condición.</p><p><b>Art. 33:</b> el trabajo es un derecho y un deber social, con remuneraciones justas para todos.</p><p><b>Art. 66:</b> derecho a una vida libre de violencia.</p><p><b>Art. 70:</b> el Estado formula políticas para la igualdad entre mujeres y hombres.</p><p>El Acuerdo Ministerial MDT-2025-006 exige un mínimo de <b>40 horas anuales</b> de capacitación, dirigidas a todos los trabajadores.</p>",
acts:[{q:"La igualdad y la no discriminación solo tratan de diferencias entre hombres y mujeres.",g:"¿Recuerdas si la lectura habla solo de hombres y mujeres o también menciona otras condiciones de las personas? Fíjate en la palabra «solo».",o:["Verdadero","Falso"],c:1,e:"Incluyen también la edad, el origen, la discapacidad y muchas otras condiciones."},{q:"La ley aplica solo a las empresas grandes.",g:"Piensa en la frase «toda empresa»: ¿importa el tamaño o cómo esté formado el equipo?",o:["Verdadero","Falso"],c:1,e:"La ley aplica a toda empresa, sin importar su tamaño ni cómo esté formado su equipo."},{q:"Esta capacitación es una obligación legal.",g:"¿Quién la pide: la empresa solo por gusto, o la normativa ecuatoriana?",o:["Verdadero","Falso"],c:0,e:"Forma parte de las obligaciones de la normativa ecuatoriana; no es una decisión interna."},{q:"¿Qué significa «entorno seguro»?",g:"Mira el recuadro de valores. Busca las palabras «acoso» y «violencia».",o:["Un lugar de trabajo libre de acoso y violencia","Un lugar con pocas herramientas","Un lugar donde nadie habla"],c:0,e:"Entorno seguro es un lugar de trabajo libre de acoso y violencia."},{q:"¿Qué dice el Artículo 11 de la Constitución?",g:"La palabra clave es «todas»: habla de todas las personas.",o:["Todas las personas son iguales y gozan de los mismos derechos","Solo algunas personas tienen derechos","El trabajo es un favor"],c:0,e:"El Art. 11 dice que todas las personas son iguales y tienen los mismos derechos."},{q:"Según el Artículo 33, el trabajo es…",g:"Dos palabras aparecen juntas: derecho y deber. Revisa «Profundizar».",o:["Un favor del empleador","Un derecho y un deber social, con remuneraciones justas","Solo un deber"],c:1,e:"El trabajo es un derecho y un deber social, con remuneraciones justas para todos."},{q:"El Artículo 66 reconoce el derecho a…",g:"Piensa en el valor «entorno seguro»: ¿qué derecho lo protege?",o:["Una vida libre de violencia","Un sueldo igual para todos","Trabajar sin horario"],c:0,e:"El Art. 66 reconoce el derecho a una vida libre de violencia."},{q:"El Acuerdo Ministerial MDT-2025-006 exige un mínimo de 40 horas anuales de capacitación.",g:"El número está en «Profundizar». ¿Recuerdas cuántas horas son?",o:["Verdadero","Falso"],c:0,e:"Exige un mínimo de 40 horas anuales, dirigidas a todos los trabajadores."},{q:"¿Quiénes deben recibir esta capacitación?",g:"Piensa en la palabra «todos»: el Acuerdo la dirige a…",o:["Solo los jefes","Todos los trabajadores","Solo los nuevos"],c:1,e:"Está dirigida a todos los trabajadores."},{q:"Un equipo donde todos se respetan y tienen las mismas oportunidades trabaja mejor.",g:"Piensa en tu galpón: ¿se trabaja mejor con respeto o con burlas?",o:["Verdadero","Falso"],c:0,e:"El respeto y la igualdad fortalecen el equipo y ayudan a que el trabajo salga bien."}],
vfold:[["La igualdad y la no discriminación solo tratan de diferencias entre hombres y mujeres.",0,"Incluyen también la edad, el origen, la discapacidad y muchas otras condiciones. Fíjate en la palabra «solo»: es una pista de que la frase deja cosas fuera."],["La ley aplica solo a las empresas grandes.",0,"La ley aplica a toda empresa, sin importar su tamaño ni cómo esté formado su equipo."],["Esta capacitación es una obligación legal.",1,"Es parte de las obligaciones de la normativa ecuatoriana; no es una decisión interna de la empresa."]],
chips:["escuchar a los demás","no hacer burlas","cuidar a mis compañeros"],

if(!S.started){h=`<div class="hero"><small>CAPACITACIÓN ANUAL · ACUERDO MINISTERIAL MDT-2025-006</small><h1>Módulo 1: Igualdad y no discriminación en el entorno laboral</h1>15 jornadas · a tu ritmo · Avícola La Lojana, San Miguel de Urcuquí, Imbabura</div><div class="pnl"><div class="say"><img src="${MASC}" alt=""><div class="bub">¡Bienvenido! Soy tu guía. Aquí aprendes a tu ritmo, jornada por jornada.</div></div><div class="cols"><div class="bx o"><h3>Lo que vas a aprender</h3><ul><li>Qué es la igualdad en el trabajo</li><li>Cómo reconocer la discriminación</li><li>Cómo tratar a todos con respeto y justicia</li></ul></div><div class="bx b"><h3>Cómo funciona</h3><ul><li>Cada jornada tiene 4 pasos: Aprender, Practicar, Responder y Terminar.</li><li>Tu tiempo se cuenta solo mientras la página está abierta.</li><li>Una jornada se abre al terminar la anterior.</li></ul></div></div><h2>¿Cómo te llamas?</h2><input type="text" id="nm" placeholder="Nombre y apellido" value="${esc(S.name)}" autocomplete="name"><button class="go" id="st" ${S.name.trim().length>1?"":"disabled"}>Comenzar el Módulo 1</button></div><p class="small" style="text-align:center">Respeto, igualdad y buen trato, siempre.</p>`}
else{h=`<div class="hero"><small>Jornada 1</small><h1>Por qué nos importa</h1>${J1.sub}</div>`+tabs()+`<div class="pnl">`;
if(S.step===0){h+=`<h2>1. Aprender</h2><div class="say"><img src="${MASC}" alt=""><div class="bub"><b>Lo esencial.</b> ${J1.ess}</div></div><div class="cols"><div class="bx b"><h3>Ejemplo en la avícola</h3>${J1.ex}</div><div class="bx o"><h3>Ideas clave</h3><ul>${J1.ideas.map(x=>"<li>"+x+"</li>").join("")}</ul></div></div><details><summary>Profundizar: base legal y más información</summary>${J1.deep}</details><button class="go" data-go="1">He leído y comprendo. Continuar</button>`}
else if(S.step===1){const n=J1.acts.length,i=Math.min(S.pi,n),k="p"+i;
if(i>=n){h+=`<h2>2. Practicar</h2><div class="why">¡Terminaste las ${n} actividades de práctica!</div><p><b>Reflexiona:</b> ¿qué significa para ti trabajar con respeto?</p><div class="bx o"><b>Así podrías responder:</b> Trabajar con respeto es tratar a todos con dignidad.</div><p>1. Toca una idea (o salta este paso):</p>`;J1.chips.forEach(c=>h+=`<button class="chip${S.chip===c?" on":""}" data-chip="${c}">${c}</button>`);h+=`<p>2. Completa con tus palabras:</p><input type="text" id="rf" value="${esc(S.ref)}" placeholder="Trabajar con respeto es…"><button class="go" data-go="2">Continuar</button>`}
else{const a=J1.acts[i],r=S.a[k];h+=`<h2>2. Practicar · Actividad ${i+1} de ${n}</h2><p><b>${a.q}</b></p><details ${r===undefined?"open":""}><summary>Guía para pensar</summary>${a.g}</details>`;a.o.forEach((o,x)=>{let c="opt";if(r!==undefined){if(x===a.c)c+=" ok2";else if(S.sel[k]===x)c+=" bad"}h+=`<button class="${c}" data-p="${k}" data-i="${x}" data-c="${a.c}">${o}</button>`});
if(r!==undefined)h+=`<div class="why ${r?"":"bad"}">${r?"¡Correcto! ":"Casi. "}La respuesta correcta es <b>${a.o[a.c]}</b>. ${a.e}</div><button class="go" data-np="1">${i+1<n?"Siguiente actividad":"Terminar las actividades"}</button>`}}
else if(S.step===2){h+=`<h2>3. Responder</h2>`;
if(S.pass){h+=`<div class="why">¡Muy bien! Respondiste todo correctamente${S.tries>1?" en el intento "+S.tries:""}.</div><button class="go" data-go="3">Continuar</button>`}
else if(S.fail){h+=`<div class="why bad"><b>Aún no.</b> Hay respuestas por corregir. Repasa la información y vuelve a intentarlo: debes responder todo bien para continuar.</div><button class="go" data-go="0">Volver a leer</button><button class="back" id="rt" style="display:block;margin:6px auto">Intentar de nuevo</button>`}
else{h+=`<p class="small">Responde con calma. Aquí no hay pistas: tienes que responder todo bien para pasar.</p>`;const rot=S.tries%3;J1.qz.forEach((q,qi)=>{const k="q"+qi;h+=`<p><b>${qi+1}. ${q[0]}</b></p>`;[0,1,2].map(i=>(i+rot)%3).forEach(oi=>{h+=`<button class="opt${S.r[k]===oi?" pick":""}" data-r="${k}" data-i="${oi}">${q[1][oi]}</button>`})});h+=`<button class="go" id="sb2" ${J1.qz.every((_,i)=>S.r["q"+i]!==undefined)?"":"disabled"}>Enviar mis respuestas</button>`}}
else{h+=`<h2>4. Terminar</h2><p><b>Hoy aprendí</b> (toca una):</p>`;J1.learn.forEach(x=>h+=`<button class="opt${S.di.l===x?" ok2":""}" data-d="l" data-v="${esc(x)}">${x}</button>`);
 h+=`<p><b>Lo puedo aplicar en mi trabajo</b> (toca una):</p>`;J1.act.forEach(x=>h+=`<button class="opt${S.di.u===x?" ok2":""}" data-d="u" data-v="${esc(x)}">${x}</button>`);
 h+=`<p><b>¿Cómo me fue?</b></p>`;["Me gustó","Más o menos","Me costó"].forEach(x=>h+=`<button class="chip${S.di.f===x?" on":""}" data-d="f" data-v="${x}">${x}</button>`);
 if(S.di.l&&S.di.u&&S.di.f){S.fin=true;const[o,t]=scoreOf(),min=Math.max(1,Math.round(S.secs/60)),d=new Date().toLocaleDateString("es-EC"),tx=`Constancia · Capacitación Avícola La Lojana · Jornada 1\nNombre: ${S.name}\nFecha: ${d}\nTiempo real: ${min} min\nPráctica: ${o} de ${t}\nEvaluación: aprobada en ${S.tries} intento(s)\nMe fue: ${S.di.f}`;
 h+=`<div class="sum"><b>${esc(S.name)}</b><div class="big">${min} min</div><div class="small">Tiempo real · Práctica ${o} de ${t} (primer intento) · Evaluación en ${S.tries} intento(s) · ${d}</div></div><a class="share" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(tx)}">Enviar por WhatsApp</a><button class="share alt" id="cp">Copiar el texto</button><textarea id="tx" readonly style="display:none">${esc(tx)}</textarea><p class="small">Prueba: solo está la Jornada 1. Las demás se abren al terminar la anterior.</p>`;save()}}
 if(S.step>0&&!S.fin)h+=`<button class="back" data-go="${S.step-1}">← Atrás</button>`;h+=`</div>`}
m.innerHTML=h;window.scrollTo(0,0);side();bind()}
function bind(){const q=s=>document.querySelectorAll(s);
const nm=document.getElementById("nm");if(nm)nm.oninput=()=>{S.name=nm.value;save();document.getElementById("st").disabled=S.name.trim().length<2;side()};
const st=document.getElementById("st");if(st)st.onclick=()=>{S.started=true;save();render()};
q("[data-go]").forEach(b=>b.onclick=()=>{S.step=+b.dataset.go;save();render()});
q("[data-p]").forEach(b=>b.onclick=()=>{const k=b.dataset.p;if(S.a[k]!==undefined)return;S.sel[k]=+b.dataset.i;ok(k,+b.dataset.i===+b.dataset.c);render()});
q("[data-np]").forEach(b=>b.onclick=()=>{S.pi++;save();render()});
q("[data-r]").forEach(b=>b.onclick=()=>{S.r[b.dataset.r]=+b.dataset.i;save();render()});
const sb2=document.getElementById("sb2");if(sb2)sb2.onclick=()=>{S.tries++;const all=J1.qz.every((qq,i)=>S.r["q"+i]===qq[2]);if(all)S.pass=true;else{S.fail=true;S.r={}}save();render()};
const rt=document.getElementById("rt");if(rt)rt.onclick=()=>{S.fail=false;save();render()};
q("[data-chip]").forEach(b=>b.onclick=()=>{S.chip=b.dataset.chip;if(!S.ref)S.ref="Trabajar con respeto es "+S.chip;save();render()});
const rf=document.getElementById("rf");if(rf)rf.oninput=()=>{S.ref=rf.value;save()};
q("[data-d]").forEach(b=>b.onclick=()=>{S.di[b.dataset.d]=b.dataset.v;save();render()});
const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const t=document.getElementById("tx");t.style.display="block";t.select();try{navigator.clipboard.writeText(t.value);cp.textContent="Copiado"}catch(e){cp.textContent="Selecciona y copia el texto"}}}
document.getElementById("tg").onclick=function(){const s=document.getElementById("sb").classList.toggle("show");this.setAttribute("aria-expanded",s)};
render();
</script></body></html>

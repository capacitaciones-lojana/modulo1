<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadernillo digital · Día 2</title>
<style>
:root{--bg:#f5efe8;--card:#fff;--ink:#25302a;--g:#173f2b;--g2:#2e6b4a;--o:#e8630a;--lo:#fde9d6;--lg:#dceadd;--lr:#f7ddd9;--r:#c0392b;--line:#d9d0c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0f2a1c;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--line:#3b4a41}}
:root[data-theme="dark"]{--bg:#14201a;--card:#1d2c24;--ink:#eef2ee;--g:#0f2a1c;--g2:#7fc79a;--lo:#3a2a1c;--lg:#1f3a2b;--lr:#42231f;--r:#ff8a7a;--line:#3b4a41}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.45 "Trebuchet MS","Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header b{font-size:17px;flex:1}header span{background:var(--o);border-radius:14px;padding:3px 12px;font-weight:700;font-size:16px}
#bar{height:6px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:var(--o);transition:width .3s}
main{max-width:520px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:25px;line-height:1.2;margin:6px 0 12px;color:var(--g2)}h2{font-size:20px;margin:18px 0 8px}
.say{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px}.say img{width:64px;flex:none}
.bub{background:var(--card);border:2px solid var(--o);border-radius:18px;padding:12px 14px;flex:1}
.ex{background:var(--lo);border-left:6px solid var(--o);border-radius:12px;padding:12px 14px;font-style:italic;margin:10px 0}
.opt,.btn2{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px;margin:9px 0;min-height:52px}
.opt:active{transform:scale(.99)}.ok{background:var(--lg)!important;border-color:var(--g2)!important}.bad{background:var(--lr)!important;border-color:var(--r)!important}
.why{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16.5px}.why.ok{background:var(--lg)}.why.bad{background:var(--lr)}
.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.row p{margin:0 0 8px}
.tg{display:flex;gap:8px}.tg button{flex:1;font:inherit;font-weight:700;font-size:16px;border-radius:24px;padding:10px 6px;border:2px solid;background:var(--card);color:inherit;min-height:46px}
.tg .y{border-color:var(--g2)}.tg .n{border-color:var(--r)}.tg .sel{color:#fff}.tg .y.sel{background:var(--g2)}.tg .n.sel{background:var(--r)}
input[type=text]{width:100%;font:inherit;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.chip{display:inline-block;font:inherit;font-size:16px;background:var(--lo);border:2px solid var(--o);color:inherit;border-radius:22px;padding:8px 14px;margin:4px 6px 4px 0;min-height:44px}
.chip.on{background:var(--o);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
nav button{font:inherit;font-weight:700;border-radius:26px;padding:13px 22px;border:2px solid var(--o);min-height:52px;color:var(--o);background:var(--card)}
nav .go{background:var(--o);color:#fff;flex:1;max-width:340px}nav button:disabled{opacity:.4}
.card{background:var(--card);border:2px solid var(--g2);border-radius:18px;padding:16px;margin:12px 0}.card p{margin:4px 0}
.big{font-size:40px;font-weight:700;color:var(--o);line-height:1}.small{font-size:15px;opacity:.85}
.share{display:block;text-align:center;text-decoration:none;font-weight:700;border-radius:26px;padding:15px;margin:10px 0;background:#1f9d55;color:#fff;font-size:18px}
.share.alt{background:var(--card);color:var(--o);border:2px solid var(--o)}textarea{width:100%;height:150px;font:15px/1.4 monospace;border-radius:12px;padding:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--o);outline-offset:2px}
</style></head><body>

{t:"intro"},
{t:"txt",h:"¿Qué significa igualdad en el trabajo?",b:"<b>Igualdad</b> es que todas las personas tengan <b>las mismas oportunidades</b> y reciban un <b>trato justo</b>, sin discriminación. <b>No</b> quiere decir que todos hagan el mismo trabajo ni que a todos les paguen igual: eso depende de las tareas, la responsabilidad y la experiencia de cada puesto.",ex:"Dos galponeros con el mismo puesto y las mismas tareas reciben el mismo trato, el mismo EPP y las mismas oportunidades, sin importar su edad o de dónde vengan."},
{t:"quiz",k:"q1",h:"Actividad: marca la respuesta correcta",o:["Todos deben hacer exactamente el mismo trabajo.","Todos deben tener oportunidades y trato justo, sin discriminación.","Todos deben ganar lo mismo sin importar sus responsabilidades."],c:1,w:"La igualdad es oportunidades y trato justo. No significa el mismo trabajo ni el mismo sueldo para todos."},
{t:"ref"},
{t:"quiz",k:"q2",h:"A practicar: caso del galpón",cs:"Marcos y Pedro tienen el mismo puesto y hacen las mismas tareas. A Pedro le entregaron guantes nuevos y lo capacitaron; a Marcos no, «porque es nuevo».",o:["Nada, es normal con los nuevos.","No hay igualdad: tienen el mismo puesto y deben recibir el mismo EPP y las mismas oportunidades.","Es igualdad porque a cada uno le dan algo distinto."],c:1,w:"Mismo puesto y mismas tareas: mismo EPP y mismas oportunidades."},
{t:"tog",k:"t1",h:"Actividad extra: ¿SÍ ES o NO ES igualdad?",r:[["Mismas oportunidades para todos.",1],["Que todos seamos idénticos.",0],["Mismo trato ante situaciones iguales.",1],["Un favor que se otorga a algunos.",0]]},
{t:"dia"},
{t:"fin"}];
const N=STEPS.length;
function tick(){if(document.visibilityState==="visible"&&S.i>0&&!S.fin){S.secs++;if(S.secs%5==0)save()}const m=Math.floor(S.secs/60),s=S.secs%60;document.getElementById("clk").textContent=m+":"+String(s).padStart(2,"0")}
setInterval(tick,1000);
function done(st){if(st.t==="intro")return S.name.trim().length>1;if(st.t==="txt")return true;if(st.t==="quiz")return S.a[st.k]!==undefined;if(st.t==="tog")return st.r.every((_,i)=>S.a[st.k+i]!==undefined);if(st.t==="ref")return true;if(st.t==="dia")return !!(S.diary.l&&S.diary.u&&S.diary.f);return true}

if(st.t==="intro"){h=say("¡Hola! Soy tu guía. Hoy haces el <b>Día 2</b>: igualdad en el trabajo. Son unos 30 minutos. Tu tiempo se cuenta solo mientras la página está abierta.")+`<h2>¿Cómo te llamas?</h2><input type="text" id="nm" placeholder="Nombre y apellido" value="${esc(S.name)}" autocomplete="name">`}
else if(st.t==="txt"){h=`<h1>${st.h}</h1>`+say(st.b)+`<div class="ex"><b>Ejemplo del galpón.</b> ${st.ex}</div>`}

else if(st.t==="tog"){h=`<h1>${st.h}</h1>`;st.r.forEach((r,i)=>{const a=S.a[st.k+i],pick=S.sel&&S.sel[st.k+i];h+=`<div class="row"><p>${r[0]}</p><div class="tg"><button class="y${pick===1?" sel":""}" data-t="${st.k+i}" data-v="1" data-c="${r[1]}">SÍ ES</button><button class="n${pick===0?" sel":""}" data-t="${st.k+i}" data-v="0" data-c="${r[1]}">NO ES</button></div>${a!==undefined?`<div class="small">${a?"✔ Correcto":"✘ La respuesta correcta era "+(r[1]?"SÍ ES":"NO ES")}</div>`:""}</div>`})}
else if(st.t==="ref"){h=`<h1>Reflexiona</h1><p><b>Escribe un ejemplo de trato justo en el trabajo.</b></p><div class="ex"><b>Así podrías responder:</b> Un trato justo es cuando a todos nos dan el mismo EPP.</div><p><b>1.</b> Toca una idea (o salta este paso):</p>`;
 ["nos pagan puntual","nos tratan con respeto","tenemos las mismas oportunidades"].forEach(c=>h+=`<button class="chip${S.chip===c?" on":""}" data-chip="${c}">${c}</button>`);
 h+=`<p><b>2.</b> Completa con tus palabras:</p><input type="text" id="rf" value="${esc(S.ref)}" placeholder="Un trato justo es cuando…">`}
else if(st.t==="dia"){h=`<h1>Mi diario</h1><p><b>Hoy aprendí</b> (toca una):</p>`;
 [["l","La igualdad es oportunidades y trato justo."],["l","Igualdad no es que todos hagan lo mismo."],["l","Todos merecemos el mismo respeto."]].forEach(x=>h+=`<button class="opt${S.diary.l===x[1]?" ok":""}" data-d="l" data-v="${x[1]}">${x[1]}</button>`);
 h+=`<p><b>Lo puedo aplicar en mi galpón</b> (toca una):</p>`;["Escuchar sin burlarme.","Hablar con respeto.","Avisar si veo algo injusto."].forEach(x=>h+=`<button class="opt${S.diary.u===x?" ok":""}" data-d="u" data-v="${x}">${x}</button>`);
 h+=`<p><b>¿Cómo me fue?</b></p>`;["Me gustó","Más o menos","Me costó"].forEach(x=>h+=`<button class="chip${S.diary.f===x?" on":""}" data-d="f" data-v="${x}">${x}</button>`)}
else{S.fin=true;const min=Math.max(1,Math.round(S.secs/60)),d=new Date().toLocaleDateString("es-EC");

 h=say("¡Terminaste el Día 2! Envía tu constancia a la monitora por WhatsApp.")+`<div class="card"><p>${esc(S.name)}</p><p class="big">${min} min</p><p class="small">Tiempo real de hoy · Aciertos ${S.sc} de ${S.tot} · ${d}</p></div><a class="share" id="wa" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(txt)}">Enviar por WhatsApp</a><button class="share alt" id="cp">Copiar el texto</button><textarea id="tx" readonly style="display:none">${esc(txt)}</textarea><button class="share alt" id="rs">Empezar de nuevo (borra mi avance)</button><p class="small">Si el botón de WhatsApp no abre, toca «Copiar el texto» y pégalo en el chat de la monitora. Esta es una página de prueba: solo tiene el Día 2.</p>`;save()}

q("[data-t]").forEach(b=>b.onclick=()=>{const k=b.dataset.t;if(S.a[k]!==undefined)return;S.sel=S.sel||{};S.sel[k]=+b.dataset.v;score(k,+b.dataset.v===+b.dataset.c);save();render()});

const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{if(rs.dataset.s!=="1"){rs.dataset.s="1";rs.textContent="Toca otra vez para borrar todo mi avance";return}try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const t=document.getElementById("tx");t.style.display="block";t.select();try{navigator.clipboard.writeText(t.value);cp.textContent="Copiado"}catch(e){cp.textContent="Selecciona y copia el texto"}}}
